name: tests

# Runs before anything reaches main: on every pull request, in the merge
# queue, and again on the push itself. Require the "tests passed" check in the
# branch rules for main to block merging on a red run.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to a commit, with the release it belongs to in a comment:
# a tag such as v4 can be moved to different code, a commit cannot.

# A newer push to the same branch or pull request replaces the run in progress
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    name: lint, unit, e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 rather than ubuntu-latest, here and in the jobs below: pinned so
        # the image does not change under the tests. macOS stays on macos-latest on
        # purpose: a new Mac is what Gaudi sets up.
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install bats and ShellCheck (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck
      - name: Install bats and ShellCheck (Linux)
        if: runner.os == 'Linux'
        run: |
          # Install only what the runner image lacks, and retry: the package mirrors
          # fail to resolve now and then.
          missing=""
          for tool in bats shellcheck; do command -v "$tool" > /dev/null 2>&1 || missing="$missing $tool"; done
          [ -n "$missing" ] || exit 0
          for attempt in 1 2 3 4 5; do
            # shellcheck disable=SC2086
            sudo apt-get update && sudo apt-get install -y $missing && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            echo "apt failed (attempt $attempt), retrying in 20 seconds"; sleep 20
          done
      # --every-bash also runs the suite under /bin/bash, which is 3.2 on macOS
      - name: Run the suite
        run: test/run --every-bash

  real-linux:
    name: real end-to-end (Linux containers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install, back up, remove and restore real packages on Debian, Fedora, openSUSE and Arch
        run: test/run real

  real-macos:
    name: real end-to-end (macOS, Homebrew)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install, back up, remove and restore a real formula
        run: GAUDI_E2E_REAL_MACOS=1 test/real/macos.sh

  # The one check to require in the branch rules. It fails when any job above
  # failed, was cancelled or was skipped, so a red run can never be merged.
  passed:
    name: tests passed
    if: always()
    needs: [suite, real-linux, real-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a test job ended with: $result"
              exit 1
            fi
          done
